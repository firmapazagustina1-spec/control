<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Registros</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 font-sans">

  <!-- PANTALLA DE LOGIN -->
  <div id="loginSection" class="max-w-md mx-auto mt-20 bg-white p-6 rounded-xl shadow-md text-center">
    <h2 class="text-2xl font-bold mb-4 text-gray-800">🔐 Acceso Privado</h2>
    <p class="text-gray-500 mb-6 text-sm">Ingresa la contraseña para acceder al sistema</p>
    <input type="password" id="passwordInput" placeholder="Contraseña..." class="w-full p-3 border rounded-lg mb-4 text-center text-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
    <button onclick="login()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">Ingresar</button>
    <p id="errorMessage" class="text-red-500 text-sm mt-3 hidden">Contraseña incorrecta. Intenta de nuevo.</p>
  </div>

  <!-- PANEL PRINCIPAL DE LA APP -->
  <div id="appSection" class="max-w-4xl mx-auto hidden">
    
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">📊 Control de Registros</h1>
      <button onclick="logout()" class="text-sm bg-gray-200 px-3 py-1 rounded-lg text-gray-700 hover:bg-gray-300">Cerrar Sesión</button>
    </div>

    <!-- FORMULARIO DE INGRESO -->
    <form id="recordForm" onsubmit="addRecord(event)" class="bg-white p-6 rounded-xl shadow-md mb-8 grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Fecha</label>
        <input type="date" id="fecha" required class="w-full p-2 border rounded-lg text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre</label>
        <input type="text" id="nombre" placeholder="Nombre completo" required class="w-full p-2 border rounded-lg text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Pagos ($)</label>
        <input type="number" id="pagos" placeholder="0.00" step="0.01" class="w-full p-2 border rounded-lg text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Fichas</label>
        <input type="number" id="fichas" placeholder="0" class="w-full p-2 border rounded-lg text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Usuarios</label>
        <input type="text" id="usuarios" placeholder="Usuario asignado" class="w-full p-2 border rounded-lg text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Respaldo (Link / URL)</label>
        <input type="url" id="respaldo" placeholder="https://..." class="w-full p-2 border rounded-lg text-sm">
      </div>
      <div class="md:col-span-2">
        <label class="block text-xs font-semibold text-gray-600 mb-1">Observaciones</label>
        <textarea id="observaciones" rows="2" placeholder="Notas o detalles..." class="w-full p-2 border rounded-lg text-sm"></textarea>
      </div>
      <button type="submit" class="md:col-span-2 bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700 transition">+ Agregar Registro</button>
    </form>

    <!-- TABLA DE REGISTROS -->
    <div class="bg-white rounded-xl shadow-md overflow-x-auto">
      <table class="w-full text-left border-collapse text-sm">
        <thead>
          <tr class="bg-gray-50 border-b text-gray-600 font-semibold">
            <th class="p-3">Fecha</th>
            <th class="p-3">Nombre</th>
            <th class="p-3">Pagos</th>
            <th class="p-3">Fichas</th>
            <th class="p-3">Usuarios</th>
            <th class="p-3">Respaldo</th>
            <th class="p-3">Observaciones</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Se llena dinámicamente -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Configura aquí tu contraseña preferida:
    const PASSWORD_CORRECTA = "gana2026";

    function login() {
      const input = document.getElementById("passwordInput").value;
      if(input === PASSWORD_CORRECTA) {
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("appSection").classList.remove("hidden");
      } else {
        document.getElementById("errorMessage").classList.remove("hidden");
      }
    }

    function logout() {
      document.getElementById("loginSection").classList.remove("hidden");
      document.getElementById("appSection").classList.add("hidden");
      document.getElementById("passwordInput").value = "";
    }

    function addRecord(e) {
      e.preventDefault();
      const fecha = document.getElementById("fecha").value;
      const nombre = document.getElementById("nombre").value;
      const pagos = document.getElementById("pagos").value || "0";
      const fichas = document.getElementById("fichas").value || "0";
      const usuarios = document.getElementById("usuarios").value || "-";
      const respaldo = document.getElementById("respaldo").value;
      const observaciones = document.getElementById("observaciones").value || "-";

      const respaldoHtml = respaldo ? `<a href="${respaldo}" target="_blank" class="text-blue-600 underline">Ver</a>` : "-";

      const tr = document.createElement("tr");
      tr.className = "border-b hover:bg-gray-50";
      tr.innerHTML = `
        <td class="p-3 whitespace-nowrap">${fecha}</td>
        <td class="p-3 font-medium">${nombre}</td>
        <td class="p-3 text-green-600 font-semibold">$${pagos}</td>
        <td class="p-3">${fichas}</td>
        <td class="p-3">${usuarios}</td>
        <td class="p-3">${respaldoHtml}</td>
        <td class="p-3 text-gray-500">${observaciones}</td>
      `;

      document.getElementById("tableBody").prepend(tr);
      document.getElementById("recordForm").reset();
    }
  </script>
</body>
</html>
